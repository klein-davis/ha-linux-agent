[package]
name = "ha-linux-agent"
version = "0.1.0"
edition = "2021"
description = "A Home Assistant MQTT bridge for exposing laptop/system state and controls as HA entities"
license = "MIT"

[lib]
name = "ha_linux_agent"
path = "src/lib.rs"

[[bin]]
name = "ha-linux-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
rumqttc = "0.24"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "signal", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
humantime = "2"
slug = "0.1"
nix = { version = "0.29", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"

[profile.release]
lto = true
strip = true
